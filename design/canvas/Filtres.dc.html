<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AnimPartner — Filtres</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #23201E; }
a { color: #C94722; } a:hover { color: #9E3417; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3A2E26; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

  <div style="flex: 0 0 auto; padding: 32px 20px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; opacity: 0.55">
    <span style="font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; color: #FFF9F2">Bibliothèque</span>
    <a href="Bibliotheque.dc.html" aria-label="Fermer les filtres" style="width: 48px; height: 48px; flex: 0 0 auto; border-radius: 14px; background: rgba(255, 249, 242, 0.18); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF9F2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto"></div>

  <section aria-label="Filtrer les jeux" style="flex: 0 0 auto; background: #FFF9F2; border-radius: 28px 28px 0 0; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -12px 40px rgba(35, 32, 30, 0.3)">

    <div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #DCCDBC"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 700">Filtres</h2>
      <button type="button" onClick="{{ reinit }}" style="font: inherit; font-size: 14px; font-weight: 700; color: #0E7C86; background: none; border: none; min-height: 44px; padding: 0 4px; cursor: pointer">Réinitialiser</button>
    </div>

    <sc-for list="{{groupes}}" as="groupe" hint-placeholder-count="5">
      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6B625B">{{ groupe.titre }}</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{groupe.options}}" as="option" hint-placeholder-count="4">
            <button type="button" onClick="{{ option.pick }}" aria-pressed="{{ option.on }}" style="{{ option.style }}">{{ option.label }}</button>
          </sc-for>
        </div>
      </fieldset>
    </sc-for>

    <div style="display: flex; gap: 10px; align-items: center; padding-top: 2px">
      <a href="Bibliotheque.dc.html" style="flex: 0 0 auto; min-height: 52px; padding: 0 22px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; color: #23201E; background: #F3EADF; border-radius: 999px">Annuler</a>
      <a href="Bibliotheque.dc.html" style="flex: 1 1 auto; min-height: 52px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800; color: #FFFFFF; background: #C94722; border-radius: 999px">Voir {{ nbResultats }} jeux</a>
    </div>

  </section>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.vide();
  }

  vide() {
    return { age: '6-8', duree: null, lieu: 'exterieur', energie: ['defoulement'], materiel: 'aucun' };
  }

  groupesDef() {
    return [
      { cle: 'age', titre: 'Âge', multi: false, options: [
        { id: '3-5', label: '3 – 5 ans' },
        { id: '6-8', label: '6 – 8 ans' },
        { id: '9-11', label: '9 – 11 ans' },
        { id: '12+', label: '12 ans et +' }
      ] },
      { cle: 'duree', titre: 'Durée', multi: false, options: [
        { id: 'court', label: '- de 10 min' },
        { id: 'moyen', label: '10 – 30 min' },
        { id: 'long', label: '+ de 30 min' }
      ] },
      { cle: 'lieu', titre: 'Lieu', multi: false, options: [
        { id: 'interieur', label: 'Intérieur' },
        { id: 'exterieur', label: 'Extérieur' },
        { id: 'partout', label: 'Peu importe' }
      ] },
      { cle: 'energie', titre: 'Énergie', multi: true, options: [
        { id: 'calme', label: 'Calme' },
        { id: 'moyen', label: 'Moyen' },
        { id: 'defoulement', label: 'Défoulement' }
      ] },
      { cle: 'materiel', titre: 'Matériel', multi: false, options: [
        { id: 'aucun', label: 'Aucun' },
        { id: 'leger', label: 'Léger' },
        { id: 'complet', label: 'Complet' }
      ] }
    ];
  }

  basculer(cle, id, multi) {
    if (multi) {
      const actuel = this.state[cle] || [];
      const suivant = actuel.indexOf(id) >= 0
        ? actuel.filter((x) => x !== id)
        : actuel.concat([id]);
      this.setState({ [cle]: suivant });
    } else {
      this.setState({ [cle]: this.state[cle] === id ? null : id });
    }
  }

  renderVals() {
    const base = 'font: inherit; font-size: 14px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer;';
    const groupes = this.groupesDef().map((g) => ({
      titre: g.titre,
      options: g.options.map((o) => {
        const valeur = this.state[g.cle];
        const on = g.multi ? (valeur || []).indexOf(o.id) >= 0 : valeur === o.id;
        return {
          label: o.label,
          on: on,
          style: base + (on
            ? ' color: #FFFFFF; background: #C94722; border: 1.5px solid #C94722;'
            : ' color: #23201E; background: #FFFFFF; border: 1.5px solid #EDE2D6;'),
          pick: () => this.basculer(g.cle, o.id, g.multi)
        };
      })
    }));

    let n = 128;
    if (this.state.age) { n = Math.round(n * 0.55); }
    if (this.state.duree) { n = Math.round(n * 0.6); }
    if (this.state.lieu && this.state.lieu !== 'partout') { n = Math.round(n * 0.7); }
    if ((this.state.energie || []).length) { n = Math.round(n * 0.65); }
    if (this.state.materiel) { n = Math.round(n * 0.75); }

    return {
      groupes: groupes,
      nbResultats: Math.max(n, 1),
      reinit: () => this.setState(this.vide())
    };
  }
}
</script>
</body>
</html>
