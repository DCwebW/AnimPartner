<style>
body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #23201E; }
a { color: #9E3A18; } a:hover { color: #9E3A18; }

/* Feuilles qui tombent : chute, balancement latéral et rotation sont trois groupes imbriqués */
@keyframes maur-chute-courte {
  0% { transform: translateY(0); opacity: 0; }
  6% { opacity: 1; }
  84% { opacity: 1; }
  100% { transform: translateY(64px); opacity: 0; }
}
@keyframes maur-chute-longue {
  0% { transform: translateY(0); opacity: 0; }
  6% { opacity: 1; }
  86% { opacity: 1; }
  100% { transform: translateY(90px); opacity: 0; }
}
@keyframes maur-envol {
  0% { transform: translate(0, 0); opacity: 0; }
  5% { opacity: 1; }
  45% { transform: translate(78px, 6px); }
  88% { opacity: 1; }
  100% { transform: translate(162px, 42px); opacity: 0; }
}
@keyframes maur-balance {
  from { transform: translateX(-7px); }
  to { transform: translateX(7px); }
}
@keyframes maur-tourne {
  0% { transform: rotate(-35deg) scaleX(1); }
  25% { transform: rotate(0deg) scaleX(0.35); }
  50% { transform: rotate(38deg) scaleX(1); }
  75% { transform: rotate(0deg) scaleX(0.4); }
  100% { transform: rotate(-35deg) scaleX(1); }
}
@keyframes maur-flotte {
  from { transform: translateX(-6px) rotate(-8deg); }
  to { transform: translateX(8px) rotate(10deg); }
}
@keyframes maur-derive {
  from { transform: translateX(0); }
  to { transform: translateX(18px); }
}

.maur-courte { animation: maur-chute-courte 9s linear infinite; }
.maur-longue { animation: maur-chute-longue 11s linear infinite; }
.maur-envol { animation: maur-envol 14s ease-in-out infinite; }
.maur-c1 { animation-duration: 9s; animation-delay: -1s; }
.maur-c2 { animation-duration: 11s; animation-delay: -4s; }
.maur-c3 { animation-duration: 8s; animation-delay: -6s; }
.maur-c4 { animation-duration: 10s; animation-delay: -2.5s; }
.maur-c5 { animation-duration: 9.5s; animation-delay: -3s; }
.maur-c6 { animation-duration: 12s; animation-delay: -7s; }
.maur-c7 { animation-duration: 8.5s; animation-delay: -5s; }
.maur-c8 { animation-duration: 10.5s; animation-delay: -8s; }
.maur-c9 { animation-duration: 9s; animation-delay: -2s; }
.maur-c10 { animation-duration: 11.5s; animation-delay: -6.5s; }
.maur-c11 { animation-duration: 14s; animation-delay: -3.5s; }

.maur-balance { animation: maur-balance 2.2s ease-in-out infinite alternate; }
.maur-b2 { animation-duration: 1.7s; animation-delay: -0.8s; }
.maur-b3 { animation-duration: 2.6s; animation-delay: -1.3s; }

.maur-tourne {
  transform-box: fill-box;
  transform-origin: center;
  animation: maur-tourne 1.9s ease-in-out infinite;
}
.maur-t2 { animation-duration: 1.5s; animation-delay: -0.5s; }
.maur-t3 { animation-duration: 2.4s; animation-delay: -1.1s; }

.maur-flotte {
  transform-box: fill-box;
  transform-origin: center;
  animation: maur-flotte 7s ease-in-out infinite alternate;
}
.maur-f2 { animation-duration: 9s; animation-delay: -4s; }

.maur-nuage1 { animation: maur-derive 19s ease-in-out infinite alternate; }
.maur-nuage2 { animation: maur-derive 26s ease-in-out -8s infinite alternate; }

@media (prefers-reduced-motion: reduce) {
  .maur-courte, .maur-longue, .maur-envol, .maur-balance, .maur-tourne,
  .maur-flotte, .maur-nuage1, .maur-nuage2 { animation: none; }
}
