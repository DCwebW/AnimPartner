<style>
body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #23201E; }
a { color: #2F5D46; } a:hover { color: #2F5D46; }

/* Neige : trois couches dupliquées sur 200 px, la chute boucle sans saut */
@keyframes mhir-chute {
  from { transform: translateY(0); }
  to { transform: translateY(200px); }
}
@keyframes mhir-derive {
  from { transform: translateX(-5px); }
  to { transform: translateX(5px); }
}
.mhir-chute-loin { animation: mhir-chute 14s linear infinite; }
.mhir-chute-mi { animation: mhir-chute 9s linear -3s infinite; }
.mhir-chute-pres { animation: mhir-chute 6s linear -2s infinite; }
.mhir-derive-loin { animation: mhir-derive 6s ease-in-out infinite alternate; }
.mhir-derive-mi { animation: mhir-derive 4.4s ease-in-out -1s infinite alternate; }
.mhir-derive-pres { animation: mhir-derive 3.4s ease-in-out -0.7s infinite alternate; }

@media (prefers-reduced-motion: reduce) {
  .mhir-chute-loin, .mhir-chute-mi, .mhir-chute-pres,
  .mhir-derive-loin, .mhir-derive-mi, .mhir-derive-pres { animation: none; }
}
</style>
</helmet>
