<style>
body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #23201E; }
a { color: #E0CE92; } a:hover { color: #E0CE92; }

/* Étoiles : scintillement et léger tremblé */
@keyframes mnue-scintille {
  0%, 100% { opacity: 1; transform: translate(0, 0) scale(1); }
  40% { opacity: 0.4; transform: translate(0.7px, -0.5px) scale(0.7); }
  70% { opacity: 0.9; transform: translate(-0.5px, 0.4px) scale(1.12); }
}
@keyframes mnue-scintille-croix {
  0%, 100% { opacity: 0.95; transform: rotate(0deg) scale(1); }
  50% { opacity: 0.45; transform: rotate(22deg) scale(0.72); }
}
.mnue-etoile {
  transform-box: fill-box;
  transform-origin: center;
  animation: mnue-scintille 3.4s ease-in-out infinite;
}
.mnue-croix { animation-name: mnue-scintille-croix; }
.mnue-e1 { animation-duration: 3.1s; animation-delay: -0.4s; }
.mnue-e2 { animation-duration: 4.6s; animation-delay: -2.1s; }
.mnue-e3 { animation-duration: 3.8s; animation-delay: -1.2s; }
.mnue-e4 { animation-duration: 5.2s; animation-delay: -3.3s; }
.mnue-e5 { animation-duration: 2.9s; animation-delay: -1.7s; }
.mnue-e6 { animation-duration: 4.2s; animation-delay: -0.9s; }
.mnue-e7 { animation-duration: 5.6s; animation-delay: -2.8s; }
.mnue-e8 { animation-duration: 3.6s; animation-delay: -2.4s; }
.mnue-e9 { animation-duration: 4.8s; animation-delay: -1.5s; }
.mnue-e10 { animation-duration: 6.2s; animation-delay: -3.9s; }

/* Étoiles filantes : deux rythmes décalés, donc des passages irréguliers */
@keyframes mnue-filante1 {
  0% { opacity: 0; transform: translate(0, 0); }
  1.5% { opacity: 1; }
  8% { opacity: 0; transform: translate(-120px, 38px); }
  100% { opacity: 0; transform: translate(-120px, 38px); }
}
@keyframes mnue-filante2 {
  0% { opacity: 0; transform: translate(0, 0); }
  1% { opacity: 1; }
  6% { opacity: 0; transform: translate(-90px, 40px); }
  100% { opacity: 0; transform: translate(-90px, 40px); }
}
.mnue-filante1 { opacity: 0; animation: mnue-filante1 11s linear 2s infinite; }
.mnue-filante2 { opacity: 0; animation: mnue-filante2 17s linear 7s infinite; }

/* Oiseaux : traversée lente, ondulation, battement d'ailes */
@keyframes mnue-vol-trio {
  0% { transform: translate(-220px, 6px); }
  72% { transform: translate(280px, -10px); }
  100% { transform: translate(280px, -10px); }
}
@keyframes mnue-vol-seul {
  0% { transform: translate(200px, 4px); }
  64% { transform: translate(-260px, -6px); }
  100% { transform: translate(-260px, -6px); }
}
@keyframes mnue-ondule {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}
@keyframes mnue-aile {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(-0.45); }
}
.mnue-trio { animation: mnue-vol-trio 24s linear -6s infinite; }
.mnue-seul { animation: mnue-vol-seul 31s linear -20s infinite; }
.mnue-ondule1 { animation: mnue-ondule 2.4s ease-in-out infinite alternate; }
.mnue-ondule2 { animation: mnue-ondule 2.9s ease-in-out -1s infinite alternate; }
.mnue-ondule3 { animation: mnue-ondule 2.1s ease-in-out -0.6s infinite alternate; }
.mnue-aile {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: mnue-aile 0.64s ease-in-out infinite;
}
.mnue-a2 { animation-duration: 0.72s; animation-delay: -0.2s; }
.mnue-a3 { animation-duration: 0.58s; animation-delay: -0.35s; }
.mnue-a4 { animation-duration: 0.8s; animation-delay: -0.1s; }

/* Loup : ombre qui se faufile entre les deux rangées de sapins */
@keyframes mnue-loup-marche {
  0% { transform: translateX(206px); }
  62% { transform: translateX(-244px); }
  100% { transform: translateX(-244px); }
}
@keyframes mnue-loup-pas {
  from { transform: translateY(0); }
  to { transform: translateY(-0.7px); }
}
@keyframes mnue-patte {
  from { transform: rotate(17deg); }
  to { transform: rotate(-17deg); }
}
@keyframes mnue-oeil {
  0%, 92%, 100% { opacity: 0.8; }
  95% { opacity: 0; }
}
.mnue-loup { animation: mnue-loup-marche 38s linear -5s infinite; }
.mnue-loup-corps { animation: mnue-loup-pas 0.45s ease-in-out infinite alternate; }
.mnue-patte {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: mnue-patte 0.9s ease-in-out infinite alternate;
}
.mnue-patte-b { animation-delay: -0.9s; }
.mnue-oeil { animation: mnue-oeil 4.5s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .mnue-etoile, .mnue-filante1, .mnue-filante2, .mnue-trio, .mnue-seul,
  .mnue-ondule1, .mnue-ondule2, .mnue-ondule3, .mnue-aile,
  .mnue-loup, .mnue-loup-corps, .mnue-patte, .mnue-oeil { animation: none; }
}
</style>
