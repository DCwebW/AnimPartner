<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #23201E; }
a { color: #C94722; } a:hover { color: #9E3417; }

@keyframes vt-rafale {
  from { stroke-dashoffset: 700; }
  to { stroke-dashoffset: 0; }
}
@keyframes vt-herbe {
  0%, 100% { transform: skewX(0deg); }
  18% { transform: skewX(-7deg); }
  32% { transform: skewX(-3deg); }
  48% { transform: skewX(-9deg); }
  66% { transform: skewX(-2.5deg); }
  82% { transform: skewX(1.5deg); }
}
@keyframes vt-derive {
  from { transform: translateX(0); }
  to { transform: translateX(22px); }
}

.vt-rafale {
  stroke-dasharray: 90 610;
  stroke-dashoffset: 700;
  animation-name: vt-rafale;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.vt-r1 { animation-duration: 6s; }
.vt-r2 { animation-duration: 7.5s; animation-delay: 1.8s; }
.vt-r3 { animation-duration: 8.5s; animation-delay: 3.4s; }

.vt-herbe {
  transform-box: view-box;
  transform-origin: 195px 105px;
  animation: vt-herbe 6s ease-in-out infinite;
}
.vt-nuage1 { animation: vt-derive 17s ease-in-out infinite alternate; }
.vt-nuage2 { animation: vt-derive 23s ease-in-out infinite alternate; }

@media (prefers-reduced-motion: reduce) {
  .vt-rafale, .vt-herbe, .vt-nuage1, .vt-nuage2 { animation: none; }
}
</style>
</helmet>
