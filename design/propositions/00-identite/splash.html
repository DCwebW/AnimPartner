<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>AnimPartner — splash natif (simulation)</title>
<style>
  /* Simulation du splash Android 12+ : fond uni, icône de 200 dp au centre,
     masquée par le système dans un cercle (ici 2/3 de la largeur de l'icône).
     Ce rendu n'est qu'une approximation : seul l'APK fait foi. */
  :root { --fond: #FEF3D4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="clair"]) { --fond: #262231; } }
  :root[data-theme="sombre"] { --fond: #262231; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fond); }
  .ecran { width: 390px; height: 844px; margin: 0 auto; background: var(--fond);
           display: flex; align-items: center; justify-content: center; }
  .icone { width: 200px; height: 200px; overflow: hidden; border-radius: 50%;
           clip-path: circle(33.4% at 50% 50%); }
  .icone img { width: 100%; height: 100%; display: block; }
</style>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
</script>
</head>
<body>
  <main class="ecran">
    <div class="icone"><img src="app/splash-icon.png" alt="AnimPartner"></div>
  </main>
</body>
</html>
