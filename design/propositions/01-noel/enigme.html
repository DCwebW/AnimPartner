.mnoe-etoile { animation: mnoe-etoile 3.2s ease-in-out infinite alternate; }
.mnoe-confetti { animation: mnoe-chute 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { .mnoe-fanion, .mnoe-lueur, .mnoe-etoile, .mnoe-confetti { animation: none; } }
