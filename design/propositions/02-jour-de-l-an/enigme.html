a { color: #80103F; } a:hover { color: #80103F; }

@keyframes mjoe-feu { 0% { opacity: 0; transform: scale(0.3); } 25% { opacity: 1; transform: scale(1); } 60% { opacity: 0.8; transform: scale(1.12); } 100% { opacity: 0; transform: scale(1.25); } }
@keyframes mjoe-scint { from { opacity: 1; transform: scale(1); } to { opacity: 0.25; transform: scale(0.6); } }
@keyframes mjoe-balance { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes mjoe-horloge { from { transform: scale(1); } to { transform: scale(1.06); } }
@keyframes mjoe-chute { from { transform: translateY(0); } to { transform: translateY(200px); } }
.mjoe-feu { animation: mjoe-feu 5s ease-out infinite; }
.mjoe-f1 { animation-delay: -1.7s; }
.mjoe-f2 { animation-delay: -3.3s; }
.mjoe-scint { animation: mjoe-scint 2.4s ease-in-out infinite alternate; }
.mjoe-s1 { animation-duration: 3.1s; animation-delay: -1s; }
.mjoe-s2 { animation-duration: 2s; animation-delay: -1.5s; }
.mjoe-ballon { animation: mjoe-balance 4s ease-in-out infinite alternate; }
.mjoe-b1 { animation-duration: 5s; animation-delay: -1.3s; }
.mjoe-b2 { animation-duration: 3.5s; animation-delay: -2.4s; }
.mjoe-horloge { animation: mjoe-horloge 3s ease-in-out infinite alternate; }
.mjoe-confetti { animation: mjoe-chute 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { .mjoe-feu, .mjoe-scint, .mjoe-ballon, .mjoe-horloge, .mjoe-confetti { animation: none; } }
